# Atualiza sozinho o CACHE_NAME do service-worker.js a cada publicação.
# Assim os aparelhos detectam a versão nova sem você mexer em número nenhum.
name: Versão automática do service worker

on:
  push:
    branches: [main]
    paths-ignore:
      - 'service-worker.js'
      - 'README.md'

permissions:
  contents: write

jobs:
  versao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar nova versão a partir do conteúdo dos arquivos
        run: |
          HASH=$(find . -type f \
            -not -path './.git/*' -not -path './.github/*' \
            -not -name 'service-worker.js' -not -name 'README.md' \
            -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-10)
          sed -i -E "s|^const CACHE_NAME = '.*';|const CACHE_NAME = 'grafia-shell-${HASH}';|" service-worker.js
          grep -n "^const CACHE_NAME" service-worker.js

      - name: Commit se mudou
        run: |
          if git diff --quiet; then echo "Sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Atualiza versão do cache [skip ci]"
          git push
